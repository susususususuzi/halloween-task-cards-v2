<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>萬聖節任務抽卡 v9 背景時鐘</title>
  <style>
    :root{
      --card-w: 260px;
      --card-h: 378px;
      --preview-w: 320px;
      --preview-h: 465px;
      --hand-w: 154px;
      --hand-h: 224px;

      --text:#2b2140;
      --panel-bg: rgba(18,18,24,.72);
      --panel-line: rgba(255,255,255,.12);
      --btn-line: rgba(255,255,255,.14);
      --shadow: 0 18px 44px rgba(0,0,0,.34);

      --stage-bg: #08080d;
      --stage-overlay: radial-gradient(circle at center, rgba(255,255,255,.02), rgba(0,0,0,0) 60%);
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
      user-select:none;
    }

    body{
      background:var(--stage-bg);
      color:#fff;
    }

    body.obs-mode{
      background:transparent;
    }

    .stage{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:var(--stage-bg);
    }

    body.obs-mode .stage{
      background:transparent;
    }

    .stage::before{
      content:"";
      position:absolute;
      inset:0;
      background:var(--stage-overlay);
      pointer-events:none;
    }

    .orb{
      position:absolute;
      border-radius:50%;
      filter:blur(48px);
      pointer-events:none;
      opacity:.32;
      animation:floaty 10s ease-in-out infinite;
    }

    body.obs-mode .orb{
      opacity:.20;
    }

    .orb.a{ width:320px;height:320px; left:6%; top:10%; background:radial-gradient(circle,#ff8fc4,transparent 70%); }
    .orb.b{ width:290px;height:290px; right:12%; top:10%; background:radial-gradient(circle,#9d8cff,transparent 70%); animation-duration:12s; }
    .orb.c{ width:260px;height:260px; left:18%; bottom:10%; background:radial-gradient(circle,#9af6e1,transparent 70%); animation-duration:11s; }
    .orb.d{ width:220px;height:220px; right:14%; bottom:15%; background:radial-gradient(circle,#ffd97e,transparent 70%); animation-duration:13s; }

    @keyframes floaty{
      0%,100%{ transform:translate(0,0); }
      50%{ transform:translate(12px,-15px); }
    }

    .topbar{
      position:absolute;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      z-index:30;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
      width:min(95vw,1100px);
    }

    .btn{
      appearance:none;
      border:none;
      outline:none;
      cursor:pointer;
      color:#fff;
      font-weight:900;
      font-size:15px;
      padding:12px 18px;
      border-radius:999px;
      backdrop-filter:blur(10px);
      border:1px solid var(--btn-line);
      box-shadow:0 12px 26px rgba(0,0,0,.24);
      transition:.22s ease;
      letter-spacing:.4px;
      background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.08));
    }

    .btn:hover{ transform:translateY(-2px) scale(1.03); }
    .btn:active{ transform:translateY(1px) scale(.98); }

    .left-panel{
      position:absolute;
      left:24px;
      top:138px;
      width:255px;
      z-index:20;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .glass-panel{
      background:var(--panel-bg);
      border:1px solid var(--panel-line);
      backdrop-filter:blur(12px);
      border-radius:20px;
      box-shadow:0 12px 28px rgba(0,0,0,.24);
      color:#fff;
      padding:14px;
    }

    .panel-title{
      font-size:14px;
      font-weight:900;
      margin-bottom:10px;
      opacity:.96;
      letter-spacing:.5px;
    }

    .count-list{
      display:grid;
      gap:8px;
    }

    .count-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(255,255,255,.06);
      font-size:13px;
      font-weight:700;
    }

    .history-list{
      max-height:260px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      padding-right:4px;
    }

    .history-item{
      font-size:12px;
      line-height:1.45;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(255,255,255,.06);
    }

    .deck-zone{
      position:absolute;
      right:90px;
      top:50%;
      transform:translateY(-50%);
      width:260px;
      height:360px;
      z-index:12;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .deck-stack{
      position:relative;
      width:220px;
      height:320px;
      cursor:pointer;
      transition:.25s ease;
    }

    .deck-stack:hover{
      transform:translateY(-6px) scale(1.02);
    }

    .deck-back{
      position:absolute;
      inset:0;
      border-radius:26px;
      overflow:hidden;
      border:2px solid rgba(255,255,255,.34);
      box-shadow:var(--shadow);
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04)),
        linear-gradient(145deg, #ff78b0, #8967ff, #48ccb0, #ffbd48);
    }

    .deck-back::before{
      content:"";
      position:absolute;
      inset:14px;
      border-radius:18px;
      border:2px dashed rgba(255,255,255,.20);
    }

    .deck-back::after{
      content:"✦";
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:116px;
      height:116px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:44px;
      color:rgba(255,255,255,.92);
      border:3px solid rgba(255,255,255,.22);
      box-shadow:0 0 0 12px rgba(255,255,255,.05);
    }

    .deck-l1{ transform:rotate(-7deg) translate(-8px,8px); opacity:.75; }
    .deck-l2{ transform:rotate(6deg) translate(8px,-6px); opacity:.88; }

    .deck-main{
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.25);
      font-size:22px;
      font-weight:900;
      letter-spacing:2px;
    }

    .deck-label{
      position:absolute;
      bottom:-40px;
      width:100%;
      text-align:center;
      color:rgba(255,255,255,.96);
      font-weight:900;
      text-shadow:0 4px 12px rgba(0,0,0,.35);
    }

    .deck-preview{
      position:absolute;
      right:170px;
      top:50%;
      width:190px;
      height:276px;
      transform:translateY(-50%) translateX(20px) scale(.92);
      opacity:0;
      pointer-events:none;
      transition:all .22s ease;
      z-index:14;
      filter:drop-shadow(0 18px 36px rgba(0,0,0,.30));
    }

    .deck-zone:hover .deck-preview{
      opacity:1;
      transform:translateY(-50%) translateX(-8px) scale(1.02) rotate(-4deg);
    }

    .focus-dim{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.36);
      opacity:0;
      transition:opacity .25s ease;
      pointer-events:none;
      z-index:16;
    }

    .focus-dim.show{
      opacity:1;
    }

    body.obs-mode .focus-dim{
      background:rgba(0,0,0,.18);
    }

    .center-layer{
      position:absolute;
      inset:0;
      z-index:18;
      pointer-events:none;
    }

    .card-wrap{
      position:absolute;
      width:var(--card-w);
      height:var(--card-h);
      transform-style:preserve-3d;
      perspective:1200px;
      pointer-events:auto;
      opacity:1;
    }

    .card-face{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border-radius:24px;
      backface-visibility:hidden;
      overflow:hidden;
      border:2px solid rgba(255,255,255,.72);
      box-shadow:var(--shadow);
      opacity:1;
      visibility:visible;
    }

    .card-back{
      transform:rotateY(0deg);
      background:
        linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.05)),
        linear-gradient(145deg, #ff78b0, #8967ff, #48ccb0, #ffbd48);
    }

    .card-back::before{
      content:"";
      position:absolute;
      inset:14px;
      border-radius:18px;
      border:2px dashed rgba(255,255,255,.20);
    }

    .card-back::after{
      content:"♡ ✦ ♡";
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      color:rgba(255,255,255,.92);
      font-size:32px;
      font-weight:900;
      letter-spacing:8px;
      text-shadow:0 2px 8px rgba(0,0,0,.18);
    }

    .card-front{
      transform:rotateY(180deg);
      background:linear-gradient(180deg, rgba(255,255,255,1), rgba(249,244,255,1));
      color:var(--text);
    }

    .card-front::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 18% 15%, rgba(255,255,255,.9), transparent 16%),
        radial-gradient(circle at 78% 12%, rgba(255,255,255,.55), transparent 16%),
        radial-gradient(circle at 50% 120%, rgba(255,180,215,.22), transparent 40%);
      pointer-events:none;
    }

    .cat-normal .badge{ background:linear-gradient(135deg,#ff7cab,#ffa5c8); }
    .cat-advanced .badge{ background:linear-gradient(135deg,#7860ff,#ab98ff); }
    .cat-boss .badge{ background:linear-gradient(135deg,#e2324b,#ff7a59); }
    .cat-curse .badge{ background:linear-gradient(135deg,#2f9e84,#62d6b8); }
    .cat-fate .badge{ background:linear-gradient(135deg,#e8a21a,#ffd36b); }

    .reward{
      margin-top:12px;
      padding:10px 12px;
      border-radius:14px;
      font-size:18px;
      font-weight:900;
      text-align:center;
      letter-spacing:.5px;
      color:#5a3b00;
      background:linear-gradient(135deg,#fff3c9,#ffe08f);
      border:1px solid rgba(160,110,0,.18);
    }
    .reward.pumpkin{
      color:#6b2a00;
      background:linear-gradient(135deg,#ffe2c4,#ffb36b);
      border-color:rgba(170,80,0,.2);
    }
    .hand-card .reward{ font-size:11px; padding:5px 6px; margin-top:6px; border-radius:10px; }

    .deck-name{
      position:absolute;
      top:-46px;
      width:100%;
      text-align:center;
      font-size:20px;
      font-weight:900;
      letter-spacing:2px;
      color:#fff;
      text-shadow:0 4px 12px rgba(0,0,0,.4);
    }

    body.deck-trick .deck-back,
    body.deck-trick .card-back{
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04)),
        linear-gradient(145deg, #ff8a2b, #b0306e, #5b2a9e, #2b1d4f);
    }
    body.deck-house .deck-back,
    body.deck-house .card-back{
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04)),
        linear-gradient(145deg, #ff78b0, #8967ff, #48ccb0, #ffbd48);
    }

    .card-inner{
      position:absolute;
      inset:0;
      z-index:1;
    }

    .header{
      padding:16px 16px 8px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      color:#fff;
      font-size:12px;
      font-weight:900;
      border-radius:999px;
      box-shadow:0 6px 14px rgba(0,0,0,.12);
    }

    .icon{
      font-size:28px;
      filter:drop-shadow(0 4px 6px rgba(0,0,0,.08));
    }

    .content{
      padding:0 18px 18px;
      display:flex;
      flex-direction:column;
      height:calc(100% - 64px);
    }

    .title{
      font-size:30px;
      font-weight:900;
      line-height:1.2;
      margin:8px 0 12px;
      color:#33244e;
    }

    .desc{
      font-size:17px;
      line-height:1.7;
      color:#55476d;
      flex:1;
    }

    .effect{
      margin-top:14px;
      padding:12px 14px;
      border-radius:16px;
      font-size:14px;
      line-height:1.6;
      background:rgba(255,255,255,.82);
      border:1px solid rgba(120,80,160,.10);
      color:#554270;
      font-weight:700;
    }

    .stars{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
    }

    .stars span{
      position:absolute;
      animation:twinkle 2.8s ease-in-out infinite;
      opacity:.45;
    }

    @keyframes twinkle{
      0%,100%{ opacity:.2; transform:scale(.9); }
      50%{ opacity:.88; transform:scale(1.12); }
    }

    .flip-inner{
      position:relative;
      width:100%;
      height:100%;
      transform-style:preserve-3d;
      transition:transform .7s cubic-bezier(.2,.8,.2,1);
    }

    .flipped .flip-inner{
      transform:rotateY(180deg);
    }

    .hand-zone{
      position:absolute;
      left:50%;
      bottom:16px;
      transform:translateX(-50%);
      width:min(92vw,1400px);
      height:240px;
      z-index:12;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      pointer-events:none;
    }

    .hand-card{
      position:relative;
      width:var(--hand-w);
      height:var(--hand-h);
      margin-left:-30px;
      border-radius:20px;
      transform-origin:center bottom;
      pointer-events:auto;
      cursor:pointer;
      transition:transform .25s ease, box-shadow .25s ease, filter .25s ease;
    }

    .hand-card:first-child{ margin-left:0; }

    .hand-card:hover{
      transform:translateY(-18px) scale(1.08) !important;
      z-index:999 !important;
      box-shadow:0 22px 46px rgba(0,0,0,.35);
      filter:brightness(1.03);
    }

    .hand-card .title{ font-size:18px; margin:6px 0 8px; }
    .hand-card .desc{ font-size:11px; line-height:1.45; }
    .hand-card .effect{ font-size:10px; padding:8px 10px; margin-top:8px; }
    .hand-card .badge{ font-size:10px; padding:5px 8px; }
    .hand-card .icon{ font-size:22px; }
    .hand-card .header{ padding:12px 12px 4px; }
    .hand-card .content{ padding:0 12px 12px; height:calc(100% - 50px); }

    .multi-burst-card{
      width:240px;
      height:348px;
      left:50%;
      top:50%;
      opacity:0;
      transform:translate(-50%,-50%) scale(.18) rotate(0deg);
    }

    .multi-burst-card.fly{
      animation:burstToCenter .65s cubic-bezier(.2,.8,.2,1) forwards;
    }

    @keyframes burstToCenter{
      0%{
        right:110px;
        left:auto;
        top:50%;
        transform:translateY(-50%) scale(.18) rotate(-18deg);
        opacity:0;
      }
      20%{ opacity:1; }
      100%{
        left:50%;
        top:50%;
        transform:translate(-50%,-50%) scale(1) rotate(var(--rot));
        opacity:1;
      }
    }

    .multi-burst-card.to-hand{
      animation:burstToHand .58s cubic-bezier(.22,.8,.22,1) forwards;
    }

    @keyframes burstToHand{
      0%{
        left:50%;
        top:50%;
        transform:translate(-50%,-50%) scale(1) rotate(var(--rot));
        opacity:1;
      }
      100%{
        left:50%;
        top:83%;
        transform:translate(-50%,-50%) scale(.58) rotate(0deg);
        opacity:0;
      }
    }

    .active-card{
      position:absolute;
      left:50%;
      top:79%;
      width:var(--preview-w);
      height:var(--preview-h);
      transform:translate(-50%,-50%) scale(.68) rotate(0deg);
      z-index:25;
      pointer-events:auto;
      cursor:pointer;
      opacity:1;
    }

    .active-card.launch{
      animation:useCardQuick 0.78s cubic-bezier(.22,.8,.2,1) forwards;
    }

    @keyframes useCardQuick{
      0%{
        left:50%;
        top:79%;
        transform:translate(-50%,-50%) scale(.68) rotate(0deg);
        opacity:1;
      }
      40%{
        left:50%;
        top:46%;
        transform:translate(-50%,-50%) scale(1.02) rotate(420deg);
      }
      75%{
        left:50%;
        top:50%;
        transform:translate(-50%,-50%) scale(1.08) rotate(700deg);
      }
      100%{
        left:50%;
        top:50%;
        transform:translate(-50%,-50%) scale(1.04) rotate(720deg);
        opacity:1;
      }
    }

    .active-card.displaying{
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) scale(1.04) rotate(720deg);
      opacity:1;
      box-shadow:
        0 0 18px rgba(255,255,255,.55),
        0 0 34px rgba(255,216,120,.22),
        0 20px 52px rgba(0,0,0,.34);
    }

    .active-card.fade-out{
      animation:vanishCenter .42s ease forwards;
    }

    @keyframes vanishCenter{
      0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.04) rotate(720deg);
      }
      100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.18) rotate(760deg);
      }
    }

    .star-burst{
      position:absolute;
      left:50%;
      top:50%;
      width:16px;
      height:16px;
      pointer-events:none;
      z-index:70;
    }

    .star-burst span{
      position:absolute;
      left:0;
      top:0;
      font-size:18px;
      color:#fff3a6;
      text-shadow:
        0 0 8px rgba(255,240,160,.9),
        0 0 18px rgba(255,220,120,.65);
      opacity:0;
      animation:starBurstAnim .55s ease-out forwards;
    }

    @keyframes starBurstAnim{
      0%{ opacity:0; transform:translate(0,0) scale(.2) rotate(0deg); }
      18%{ opacity:1; transform:translate(0,0) scale(1) rotate(30deg); }
      100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(.45) rotate(120deg); }
    }

    .trail-spark{
      position:absolute;
      width:12px;
      height:12px;
      border-radius:50%;
      pointer-events:none;
      z-index:68;
      background: radial-gradient(circle, #fff, #ffe08f 55%, transparent 72%);
      animation: trailSparkAnim .55s ease-out forwards;
    }

    @keyframes trailSparkAnim{
      0%{ opacity:1; transform:translate(0,0) scale(1); }
      100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(.25); }
    }

    .toast{
      position:absolute;
      left:50%;
      top:124px;
      transform:translateX(-50%);
      z-index:50;
      color:#fff;
      background:rgba(16,16,22,.78);
      border:1px solid rgba(255,255,255,.15);
      backdrop-filter:blur(10px);
      border-radius:999px;
      padding:10px 16px;
      font-size:13px;
      font-weight:800;
      box-shadow:0 10px 24px rgba(0,0,0,.26);
      opacity:0;
      pointer-events:none;
    }

    .toast.show{
      animation:toastInOut 2.2s ease forwards;
    }

    @keyframes toastInOut{
      0%{ opacity:0; transform:translateX(-50%) translateY(-6px); }
      12%,78%{ opacity:1; transform:translateX(-50%) translateY(0); }
      100%{ opacity:0; transform:translateX(-50%) translateY(-6px); }
    }


    .score-panel{
      position:absolute;
      left:24px;
      top:18px;
      z-index:40;
      width:255px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 14px;
      border-radius:20px;
      background:var(--panel-bg);
      border:1px solid var(--panel-line);
      backdrop-filter:blur(12px);
      box-shadow:0 12px 28px rgba(0,0,0,.24);
    }
    .score-icon{ font-size:40px; line-height:1; filter:drop-shadow(0 4px 8px rgba(0,0,0,.3)); }
    .score-main{ flex:1; min-width:0; }
    .score-label{ font-size:13px; font-weight:900; opacity:.85; letter-spacing:1px; }
    .score-value{
      font-size:42px; font-weight:900; line-height:1.05;
      color:#ffe08f; text-shadow:0 0 14px rgba(255,210,110,.45);
      display:inline-block;
    }
    body.deck-house .score-value{ color:#ffb36b; text-shadow:0 0 14px rgba(255,150,60,.5); }
    .score-value.pop{ animation:scorePop .45s ease; }
    .score-value.drop{ animation:scoreDrop .45s ease; }
    @keyframes scorePop{ 0%{transform:scale(1)} 40%{transform:scale(1.35)} 100%{transform:scale(1)} }
    @keyframes scoreDrop{ 0%{transform:translateY(0)} 30%{transform:translateY(5px); opacity:.6} 100%{transform:translateY(0); opacity:1} }
    .score-btns{ display:grid; grid-template-columns:repeat(2, 34px); gap:6px; }
    .score-btn{
      appearance:none; border:1px solid var(--btn-line); cursor:pointer;
      width:34px; height:28px; border-radius:10px;
      color:#fff; font-weight:900; font-size:13px;
      background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.08));
    }
    .score-btn:hover{ filter:brightness(1.2); }
    .score-btn.reset{ grid-column:span 2; width:auto; font-size:11px; opacity:.75; }
    .score-btn.reset.armed{ background:#c23a4e; opacity:1; }
    body.obs-mode .score-btns{ opacity:.0; transition:opacity .2s; }
    body.obs-mode .score-panel:hover .score-btns{ opacity:1; }
    .left-panel{ top:150px !important; }


    .cat-ice .badge{ background:linear-gradient(135deg,#2f8fd8,#7cc8ff); }
    .cat-avatar .badge{ background:linear-gradient(135deg,#d6489e,#ff9bd2); }
    .cat-special .badge{ background:linear-gradient(135deg,#2a4fd6,#6f8cff); }

  <script>

    // 屋主卡：屋主抽、搗蛋鬼執行，獎勵是「糖果」給搗蛋鬼

          { title:"粉絲名由來", desc:"說出粉絲名和由來，再用粉絲名跟屋主的聊天室打招呼", icon:"👋", category:"破冰卡", type:"ice", reward:1 },
          { title:"南瓜叫賣", desc:"用夜市叫賣語氣賣南瓜 20 秒", icon:"🎃", category:"小任務", type:"normal", reward:1 },

          { title:"迷你搗蛋鬼", desc:"立繪縮到原本的 1/3，丟到畫面角落，到這站結束", icon:"🔍", category:"立繪卡", type:"avatar", reward:1 },
          { title:"黑白恐怖片", desc:"立繪加灰階濾鏡，到下一站結束", icon:"🎞️", category:"立繪卡", type:"avatar", reward:2 },

          { title:"聊天室出征", desc:"邀請自己的聊天室去搗蛋鬼的台打一句「不給糖就搗蛋」（觀眾自由參加），每有一位觀眾去留言，對方糖果就 −0.5，限時 30 秒", icon:"📢", category:"特殊卡", type:"special", reward:"對方 🍬 −0.5／人" }
        ]
      },
      trick: {
        name: "搗蛋卡",
        unit: "南瓜燈",
        unitIcon: "🎃",
        rewardClass: "pumpkin",
        hint: "搗蛋鬼出牌、屋主執行，屋主拿南瓜燈。",
        cards: [
          { title:"共通點搜查", desc:"兩人在 60 秒內找出 3 個共通點，遊戲、食物、作息都算", icon:"🔎", category:"破冰卡", type:"ice", reward:"🎃🍬 南瓜燈、糖果各 +1" },
          { title:"快問快答", desc:"搗蛋鬼連問 5 題，屋主秒答：最愛的糖、最近在玩的遊戲、最常開的台型、最推的回放、今晚的心情", icon:"⚡", category:"破冰卡", type:"ice", reward:1 },
          { title:"第一印象", desc:"說出對搗蛋鬼的第一印象", icon:"👀", category:"破冰卡", type:"ice", reward:1 },
          { title:"今晚暱稱", desc:"替搗蛋鬼取一個今晚專用的暱稱（不違背善良風俗），這站接下來都要用它叫對方", icon:"🏷️", category:"破冰卡", type:"ice", reward:1 },
          { title:"推薦回放", desc:"推薦一個自己最好笑的回放，花 30 秒說明好笑在哪", icon:"📺", category:"破冰卡", type:"ice", reward:1 },
          { title:"門鈴惡作劇", desc:"接下來 1 分鐘，屋主每次開口前要先學門鈴「叮咚」", icon:"🔔", category:"小搗蛋", type:"normal", reward:1 },
          { title:"客訴專線", desc:"搗蛋鬼當奇怪客人客訴，屋主用客服語氣處理 30 秒", icon:"🎧", category:"小搗蛋", type:"normal", reward:1 },
          { title:"互相宣傳", desc:"幫搗蛋鬼的台打 30 秒廣告", icon:"📣", category:"大搗蛋", type:"advanced", reward:2 },
          { title:"真心話問答", desc:"回答搗蛋鬼一個問題（安全範圍內）", icon:"💬", category:"大搗蛋", type:"advanced", reward:2 },
          { title:"禁止正常說話", desc:"接下來三句話都要用唱的或朗誦的", icon:"🎼", category:"大搗蛋", type:"advanced", reward:2 },
          { title:"禁止說「不」", desc:"搗蛋鬼連問 30 秒，屋主說出「不」就失敗", icon:"🙅", category:"魔王卡", type:"boss", reward:3, note:"失敗 0 盞；也可當場放棄，改拿 1 盞" },
          { title:"糖果屋改名", desc:"搗蛋鬼替糖果屋取新名字，下一位客人來時要用新名字介紹", icon:"🪧", category:"陷阱卡", type:"curse", reward:1 },
          { title:"殭屍屋主", desc:"下一位客人來時，要用殭屍語氣迎接", icon:"🧟", category:"陷阱卡", type:"curse", reward:1 },
          { title:"搗蛋鬼簽名", desc:"下一位客人來時，先說「XX 來搗蛋過了」並幫他宣傳一句", icon:"✍️", category:"陷阱卡", type:"curse", reward:1 },
          { title:"被搗蛋了", desc:"立繪掛上「我被○○搗蛋了」名牌（○○填搗蛋鬼名字），持續到遊戲結束", icon:"📛", category:"立繪卡", type:"avatar", reward:1 },
          { title:"鏡像屋主", desc:"立繪左右翻轉，到遊戲結束", icon:"🪞", category:"立繪卡", type:"avatar", reward:1 },
          { title:"幽靈附身", desc:"立繪透明度調到 50%，變半透明幽靈，到遊戲結束", icon:"👻", category:"立繪卡", type:"avatar", reward:2 },
          { title:"南瓜燈被吹熄", desc:"不用做任務，搗蛋鬼吹熄屋主 1 盞南瓜燈，搗蛋鬼 +1 顆糖果", icon:"💨", category:"命運卡", type:"fate", reward:"屋主 🎃−1／搗蛋鬼 🍬+1" },
          { title:"聊天室出征", desc:"邀請自己的聊天室去屋主的台打一句「不給糖就搗蛋」（觀眾自由參加），每有一位觀眾去留言，對方南瓜燈就 −0.5，限時 30 秒", icon:"📢", category:"特殊卡", type:"special", reward:"對方 🎃 −0.5／人" }
        ]
      }
    };

    // ===== 兌換商店（價目表）=====
    const SHOP_ITEMS = [
      { price:10, text:"指定一人仰臥起坐 20 下" },
      { price:10, text:"指定一人做 20 下開合跳或伏地挺身" },
      { price:15, text:"指定一人下一場直播帶著你指定的物品直播（安全的東西）" },
      { price:20, text:"指定一人做一件事（主辦有權決定你的一件事可不可執行，比如送一套陶珠隱園就是不行的）" },
      { price:30, text:"指定一人在 X（Twitter）發布一張當場盲畫（閉眼畫）的虛擬形象手繪圖" }
    ];

    const HAND_MAX = 7;
    let currentDeckKey = params.get("deck") === "trick" ? "trick" : "house";
    function currentDeck(){ return DECKS[currentDeckKey]; }

    function rewardText(card){
      const d = currentDeck();
      if(typeof card.reward === "number") return `${d.unitIcon} +${card.reward} ${d.unit}`;
      return card.reward;
    }

    function applyDeckTheme(){
      const d = currentDeck();
      document.body.classList.remove("deck-house","deck-trick");
      document.body.classList.add("deck-" + currentDeckKey);
      document.getElementById("deckName").textContent = d.name;
      document.getElementById("previewTitle").textContent = d.name;
      document.getElementById("previewEffect").textContent = d.hint;
      document.title = `萬聖節任務抽卡｜${d.name}`;
    }

    const centerLayer = document.getElementById("centerLayer");
    const handZone = document.getElementById("handZone");
    const countList = document.getElementById("countList");
    const historyList = document.getElementById("historyList");
    const toast = document.getElementById("toast");
    const focusDim = document.getElementById("focusDim");
    const deckZone = document.getElementById("deckZone");

    let deck = [];
    let handCards = [];
    let drawBusy = false;
    let activeCardEl = null;
    let history = [];

    function shuffle(arr){
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.remove("show");
      void toast.offsetWidth;
      toast.classList.add("show");
    }

    function renderCounts(){
      const order = [];
      currentDeck().cards.forEach(c=>{ if(!order.includes(c.category)) order.push(c.category); });
      countList.innerHTML = order.map(cat=>{
        const n = currentDeck().cards.filter(c=>c.category===cat).length;
        return `<div class="count-row"><span>${cat}</span><span>${n}</span></div>`;
      }).join("");
    }

    function renderHistory(){
      historyList.innerHTML = "";
      if(history.length === 0){
        historyList.innerHTML = `<div class="history-item">尚未抽卡</div>`;
        return;
      }
      history.slice().reverse().forEach(item=>{
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `<b>${item.category}</b><br>${item.title}`;
        historyList.appendChild(div);
      });
    }

    function getCategoryClass(card){
      return "cat-" + card.type;
    }

    function makeStars(){
      const wrap = document.createElement("div");
      wrap.className = "stars";
      const chars = ["✦","✧","★","♡"];
      for(let i=0;i<8;i++){
        const s = document.createElement("span");
        s.textContent = chars[Math.floor(Math.random()*chars.length)];
        s.style.left = Math.random()*100 + "%";
        s.style.top = Math.random()*100 + "%";
        s.style.fontSize = (11 + Math.random()*7) + "px";
        s.style.animationDelay = (Math.random()*2.4) + "s";
        wrap.appendChild(s);
      }
      return wrap;
    }

    function createCardWrap(card, isHand=false, customClass=""){
  const wrap = document.createElement("div");
  wrap.className = `${isHand ? "hand-card" : "card-wrap"} ${getCategoryClass(card)} ${customClass}`.trim();

  wrap.innerHTML = `
    <div class="flip-inner">
      <div class="card-face card-back"></div>
      <div class="card-face card-front">
        <div class="card-inner">
          <div class="header">
            <span class="badge">${card.category}</span>
            <span class="icon">${card.icon}</span>
          </div>
          <div class="content">
            <div class="title">${card.title}</div>
            <div class="desc">${card.desc}</div>
            <div class="reward ${currentDeck().rewardClass}">${rewardText(card)}</div>
            ${card.note ? `<div class="effect">${card.note}</div>` : ""}
          </div>
        </div>
      </div>
    </div>
  `;
  wrap.querySelector(".card-front").appendChild(makeStars());

  if(isHand) wrap.classList.add("flipped");
  return wrap;
}

    function starBurst(target, count=14){
      const rect = target.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for(let i=0;i<count;i++){
        const wrap = document.createElement("div");
        wrap.className = "star-burst";
        wrap.style.left = centerX + "px";
        wrap.style.top = centerY + "px";

        const star = document.createElement("span");
        star.textContent = Math.random() > 0.5 ? "✦" : "★";
        star.style.setProperty("--dx", `${(Math.random()-0.5)*170}px`);
        star.style.setProperty("--dy", `${(Math.random()-0.5)*140}px`);
        star.style.animationDelay = `${Math.random()*80}ms`;

        wrap.appendChild(star);
        document.body.appendChild(wrap);
        setTimeout(()=>wrap.remove(), 700);
      }
    }

    function renderHand(){
      handZone.innerHTML = "";
      const total = handCards.length;

      handCards.forEach((card, index)=>{
        const el = createCardWrap(card, true);
        const spread = total > 1 ? (index - (total - 1) / 2) : 0;
        const rotate = spread * 6;
        const lift = Math.abs(spread) * 4;
        el.style.transform = `translateY(${lift}px) rotate(${rotate}deg)`;
        el.style.zIndex = 100 + index;
        el.addEventListener("click", ()=>useHandCard(index));
        el.addEventListener("contextmenu", (e)=>{ e.preventDefault(); discardHandCard(index); });
        handZone.appendChild(el);
      });
    }

    async function drawFiveCards(){
      if(drawBusy || activeCardEl) return;
      const need = HAND_MAX - handCards.length;
      if(need <= 0){
        showToast(`手牌已經有 ${HAND_MAX} 張了`);
        return;
      }

      drawBusy = true;
      focusDim.classList.add("show");

      const drawCount = need;
      const drawn = [];
      const pool = currentDeck().cards;

      for(let i=0;i<drawCount;i++){
        // 放回抽：每次都從完整卡池隨機抽，牌庫不會減少，可能抽到重複的卡
        const card = pool[Math.floor(Math.random()*pool.length)];
        drawn.push(card);
        history.push({ category: card.category, title: card.title });
      }

      renderCounts();
      renderHistory();

      const els = [];
      const rotations = [-27,-18,-9,0,9,18,27].slice(0, Math.max(1, drawn.length));

      drawn.forEach((card, i)=>{
        const el = createCardWrap(card, false, "multi-burst-card");
        el.style.setProperty("--rot", rotations[i] + "deg");
        centerLayer.appendChild(el);
        els.push(el);
      });

      await new Promise(r=>requestAnimationFrame(r));
      els.forEach(el=>el.classList.add("fly"));

      setTimeout(()=>{
        els.forEach(el=>el.classList.add("flipped"));
      }, 520);

      setTimeout(()=>{
        requestAnimationFrame(()=>{
          els.forEach(el=>el.classList.add("to-hand"));
        });
      }, 1200);

      setTimeout(()=>{
        els.forEach(el=>{
          if(el.parentNode) el.remove();
        });
        handCards.push(...drawn);
        renderHand();
        focusDim.classList.remove("show");
        drawBusy = false;
      }, 1800);
    }

    function useHandCard(index){
      if(drawBusy || activeCardEl || handCards.length === 0) return;

      const card = handCards[index];
      handCards.splice(index, 1);
      renderHand();

      drawBusy = true;
      focusDim.classList.add("show");

      const active = createCardWrap(card, false, "active-card");
      active.classList.add("flipped");
      centerLayer.appendChild(active);
      activeCardEl = active;

      requestAnimationFrame(()=>{
        active.classList.add("launch");
      });

      setTimeout(()=>{
        starBurst(active, 16);
      }, 420);

      setTimeout(()=>{
        active.classList.remove("launch");
        active.classList.add("displaying");
        drawBusy = false;
      }, 780);

      const closeActive = () => {
        if(active.dataset.closing === "1") return;
        active.dataset.closing = "1";
        active.classList.add("fade-out");

        setTimeout(()=>{
          if(active.parentNode) active.remove();
          if(activeCardEl === active) activeCardEl = null;
          drawBusy = false;
          focusDim.classList.remove("show");
        }, 420);
      };

      active.addEventListener("click", ()=>{
        if(!active.classList.contains("displaying")) return;
        closeActive();
      });
    }

    function clearHand(){
      if(drawBusy || activeCardEl) return;
      handCards = [];
      renderHand();
      showToast("已清空手牌");
    }

    function refillDeck(){
      const inHand = new Set(handCards.map(c=>c.title));
      deck = shuffle(currentDeck().cards.filter(c=>!inHand.has(c.title)));
      renderCounts();
    }

    function discardHandCard(index){
      if(drawBusy || activeCardEl) return;
      const card = handCards[index];
      if(!card) return;
      handCards.splice(index, 1);
      renderHand();
      showToast(`已丟掉「${card.title}」`);
    }

    function reshuffleKeepHand(){
      if(drawBusy || activeCardEl) return;
      refillDeck();
      showToast("已重洗牌庫（手牌保留）");
    }

    function initAll(){
      deck = shuffle([...currentDeck().cards]);
      handCards = [];
      history = [];
      drawBusy = false;
      activeCardEl = null;
      centerLayer.innerHTML = "";
      renderHand();
      renderCounts();
      renderHistory();
      focusDim.classList.remove("show");
      showToast("已重置牌庫");
    }

    deckZone.addEventListener("click", ()=>{
      drawFiveCards();
    });

    document.getElementById("clearHandBtn").addEventListener("click", clearHand);
    

    function switchDeck(){
      if(drawBusy || activeCardEl) return;
      currentDeckKey = currentDeckKey === "house" ? "trick" : "house";
      const url = new URL(location.href);
      url.searchParams.set("deck", currentDeckKey);
      window.history.replaceState(null, "", url);
      applyDeckTheme();
      initAll();
      refreshScoreForDeck();
      showToast(`已切換為${currentDeck().name}`);
    }
    document.getElementById("switchDeckBtn").addEventListener("click", switchDeck);


    // ===== 計分：屋主頁（屋主卡）記南瓜燈；搗蛋鬼頁（搗蛋卡）記糖果 =====
    const SCORE_INFO = {
      house: { key:"halloween-score-pumpkin", icon:"🎃", label:"我的南瓜燈", unit:"南瓜燈" },
      trick: { key:"halloween-score-candy",  icon:"🍬", label:"我的糖果", unit:"糖果" }
    };
    const scoreValueEl = document.getElementById("scoreValue");
    function loadScore(){
      try{ return parseFloat(localStorage.getItem(SCORE_INFO[currentDeckKey].key) || "0") || 0; }
      catch(e){ return scoreMem[currentDeckKey] || 0; }
    }
    const scoreMem = { house:0, trick:0 };
    let score = 0;
    function saveScore(){
      scoreMem[currentDeckKey] = score;
      try{ localStorage.setItem(SCORE_INFO[currentDeckKey].key, String(score)); }catch(e){}
    }
    function renderScore(anim){
      const info = SCORE_INFO[currentDeckKey];
      document.getElementById("scoreIcon").textContent = info.icon;
      document.getElementById("scoreLabel").textContent = info.label;
      scoreValueEl.textContent = fmt(score);
      if(anim){
        scoreValueEl.classList.remove("pop","drop");
        void scoreValueEl.offsetWidth;
        scoreValueEl.classList.add(anim);
      }
    }
    function changeScore(delta){
      score = Math.max(0, Math.round((score + delta) * 2) / 2);
      saveScore();
      renderScore(delta > 0 ? "pop" : "drop");
      if(delta > 0) starBurst(scoreValueEl, 8);
    }
    function refreshScoreForDeck(){
      score = loadScore();
      renderScore();
    }
    document.querySelectorAll(".score-btn[data-delta]").forEach(btn=>{
      btn.addEventListener("click", ()=>changeScore(parseFloat(btn.dataset.delta)));
    });
    const resetBtn = document.getElementById("scoreResetBtn");
    let resetTimer = null;
    resetBtn.addEventListener("click", ()=>{
      // 點兩下才歸零，避免誤觸
      if(resetBtn.classList.contains("armed")){
        clearTimeout(resetTimer);
        resetBtn.classList.remove("armed");
        resetBtn.textContent = "歸零";
        score = 0; saveScore(); renderScore("drop");
        showToast("分數已歸零");
      }else{
        resetBtn.classList.add("armed");
        resetBtn.textContent = "再點一次歸零";
        resetTimer = setTimeout(()=>{ resetBtn.classList.remove("armed"); resetBtn.textContent = "歸零"; }, 2500);
      }
    });


    function fmt(n){ return Number.isInteger(n) ? String(n) : n.toFixed(1); }

    // ===== 兌換商店 =====
    const shopOverlay = document.getElementById("shopOverlay");
    function renderShop(){
      const d = { unitIcon: SCORE_INFO[currentDeckKey].icon, unit: SCORE_INFO[currentDeckKey].unit };
      document.getElementById("shopBalance").textContent = `目前：${d.unitIcon} ${fmt(score)} ${d.unit}`;
      const list = document.getElementById("shopList");
      list.innerHTML = "";
      SHOP_ITEMS.forEach((item, i)=>{
        const row = document.createElement("div");
        row.className = "shop-item";
        row.innerHTML = `<div class="shop-price">${item.price}<small>${d.unitIcon} ${d.unit}</small></div>
          <div class="shop-text">${item.text}</div>
          <button class="shop-buy" ${score < item.price ? "disabled" : ""}>兌換</button>`;
        row.querySelector(".shop-buy").addEventListener("click", ()=>redeem(i));
        list.appendChild(row);
      });
    }
    function openShop(){ renderShop(); shopOverlay.classList.add("show"); }
    function closeShop(){ shopOverlay.classList.remove("show"); }
    document.getElementById("shopBtn").addEventListener("click", openShop);
    document.getElementById("shopClose").addEventListener("click", closeShop);
    shopOverlay.addEventListener("click", (e)=>{ if(e.target === shopOverlay) closeShop(); });

    function redeem(i){
      const item = SHOP_ITEMS[i];
      if(score < item.price){ showToast("分數不夠喔"); return; }
      changeScore(-item.price);
      history.push({ category:"🛒 兌換", title:item.text });
      renderHistory();
      closeShop();
      const d = { unitIcon: SCORE_INFO[currentDeckKey].icon, unit: SCORE_INFO[currentDeckKey].unit };
      const card = document.createElement("div");
      card.className = "redeem-card";
      card.innerHTML = `<div class="redeem-tag">兌換成功</div>
        <div class="redeem-text">${item.text}</div>
        <div class="redeem-cost">−${item.price} ${d.unitIcon} ${d.unit}</div>
        <div class="redeem-hint">點一下關閉</div>`;
      document.querySelector(".stage").appendChild(card);
      focusDim.classList.add("show");
      requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add("show")));
      setTimeout(()=>starBurst(card, 22), 250);
      card.addEventListener("click", ()=>{
        card.classList.remove("show");
        setTimeout(()=>{ card.remove(); if(!activeCardEl) focusDim.classList.remove("show"); }, 320);
      });
    }


    // ===== 背景時鐘 =====
    if(params.get("clock") === "0") document.body.classList.add("no-clock");
    const bgClock = document.getElementById("bgClock");
    function tickClock(){
      const d = new Date();
      const p2 = n => String(n).padStart(2,"0");
      bgClock.textContent = `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
    }
    tickClock();
    setInterval(tickClock, 1000);

    document.addEventListener("keydown", (e)=>{
      if(["=","+","ArrowUp"].includes(e.key)){ e.preventDefault(); changeScore(1); return; }
      if(["-","_","ArrowDown"].includes(e.key)){ e.preventDefault(); changeScore(-1); return; }
      const key = e.key.toLowerCase();
      if(key === " "){
        e.preventDefault();
        if(!drawBusy && !activeCardEl) drawFiveCards();
      }
      if(key === "c" && !drawBusy && !activeCardEl) clearHand();
      
    });

    applyDeckTheme();
    initAll();
    refreshScoreForDeck();
  </script>
</body>
</html>
