<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>萬聖節任務抽卡 v6 雙牌庫＋計分</title>
  <style>
    :root{
      --card-w: 260px;
      --card-h: 378px;
      --preview-w: 320px;
      --preview-h: 465px;
      --hand-w: 154px;
      --hand-h: 224px;

      --text:#2b2140;
      --panel-bg: rgba(18,18,24,.72);
      --panel-line: rgba(255,255,255,.12);
      --btn-line: rgba(255,255,255,.14);
      --shadow: 0 18px 44px rgba(0,0,0,.34);

      --stage-bg: #08080d;
      --stage-overlay: radial-gradient(circle at center, rgba(255,255,255,.02), rgba(0,0,0,0) 60%);
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
      user-select:none;
    }

    body{
      background:var(--stage-bg);
      color:#fff;
    }

    body.obs-mode{
      background:transparent;
    }

    .stage{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:var(--stage-bg);
    }

    body.obs-mode .stage{
      background:transparent;
    }

    .stage::before{
      content:"";
      position:absolute;
      inset:0;
      background:var(--stage-overlay);
      pointer-events:none;
    }

    .orb{
      position:absolute;
      border-radius:50%;
      filter:blur(48px);
      pointer-events:none;
      opacity:.32;
      animation:floaty 10s ease-in-out infinite;
    }

    body.obs-mode .orb{
      opacity:.20;
    }

    .orb.a{ width:320px;height:320px; left:6%; top:10%; background:radial-gradient(circle,#ff8fc4,transparent 70%); }
    .orb.b{ width:290px;height:290px; right:12%; top:10%; background:radial-gradient(circle,#9d8cff,transparent 70%); animation-duration:12s; }
    .orb.c{ width:260px;height:260px; left:18%; bottom:10%; background:radial-gradient(circle,#9af6e1,transparent 70%); animation-duration:11s; }
    .orb.d{ width:220px;height:220px; right:14%; bottom:15%; background:radial-gradient(circle,#ffd97e,transparent 70%); animation-duration:13s; }

    @keyframes floaty{
      0%,100%{ transform:translate(0,0); }
      50%{ transform:translate(12px,-15px); }
    }

    .topbar{
      position:absolute;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      z-index:30;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
      width:min(95vw,1100px);
    }

    .btn{
      appearance:none;
      border:none;
      outline:none;
      cursor:pointer;
      color:#fff;
      font-weight:900;
      font-size:15px;
      padding:12px 18px;
      border-radius:999px;
      backdrop-filter:blur(10px);
      border:1px solid var(--btn-line);
      box-shadow:0 12px 26px rgba(0,0,0,.24);
      transition:.22s ease;
      letter-spacing:.4px;
      background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.08));
    }

    .btn:hover{ transform:translateY(-2px) scale(1.03); }
    .btn:active{ transform:translateY(1px) scale(.98); }

    .left-panel{
      position:absolute;
      left:24px;
      top:138px;
      width:255px;
      z-index:20;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .glass-panel{
      background:var(--panel-bg);
      border:1px solid var(--panel-line);
      backdrop-filter:blur(12px);
      border-radius:20px;
      box-shadow:0 12px 28px rgba(0,0,0,.24);
      color:#fff;
      padding:14px;
    }

    .panel-title{
      font-size:14px;
      font-weight:900;
      margin-bottom:10px;
      opacity:.96;
      letter-spacing:.5px;
    }

    .count-list{
      display:grid;
      gap:8px;
    }

    .count-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(255,255,255,.06);
      font-size:13px;
      font-weight:700;
    }

    .history-list{
      max-height:260px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      padding-right:4px;
    }

    .history-item{
      font-size:12px;
      line-height:1.45;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(255,255,255,.06);
    }

    .deck-zone{
      position:absolute;
      right:90px;
      top:50%;
      transform:translateY(-50%);
      width:260px;
      height:360px;
      z-index:12;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .deck-stack{
      position:relative;
      width:220px;
      height:320px;
      cursor:pointer;
      transition:.25s ease;
    }

    .deck-stack:hover{
      transform:translateY(-6px) scale(1.02);
    }

    .deck-back{
      position:absolute;
      inset:0;
      border-radius:26px;
      overflow:hidden;
      border:2px solid rgba(255,255,255,.34);
      box-shadow:var(--shadow);
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04)),
        linear-gradient(145deg, #ff78b0, #8967ff, #48ccb0, #ffbd48);
    }

    .deck-back::before{
      content:"";
      position:absolute;
      inset:14px;
      border-radius:18px;
      border:2px dashed rgba(255,255,255,.20);
    }

    .deck-back::after{
      content:"✦";
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:116px;
      height:116px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:44px;
      color:rgba(255,255,255,.92);
      border:3px solid rgba(255,255,255,.22);
      box-shadow:0 0 0 12px rgba(255,255,255,.05);
    }

    .deck-l1{ transform:rotate(-7deg) translate(-8px,8px); opacity:.75; }
    .deck-l2{ transform:rotate(6deg) translate(8px,-6px); opacity:.88; }

    .deck-main{
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.25);
      font-size:22px;
      font-weight:900;
      letter-spacing:2px;
    }

    .deck-label{
      position:absolute;
      bottom:-40px;
      width:100%;
      text-align:center;
      color:rgba(255,255,255,.96);
      font-weight:900;
      text-shadow:0 4px 12px rgba(0,0,0,.35);
    }

    .deck-preview{
      position:absolute;
      right:170px;
      top:50%;
      width:190px;
      height:276px;
      transform:translateY(-50%) translateX(20px) scale(.92);
      opacity:0;
      pointer-events:none;
      transition:all .22s ease;
      z-index:14;
      filter:drop-shadow(0 18px 36px rgba(0,0,0,.30));
    }

    .deck-zone:hover .deck-preview{
      opacity:1;
      transform:translateY(-50%) translateX(-8px) scale(1.02) rotate(-4deg);
    }

    .focus-dim{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.36);
      opacity:0;
      transition:opacity .25s ease;
      pointer-events:none;
      z-index:16;
    }

    .focus-dim.show{
      opacity:1;
    }

    body.obs-mode .focus-dim{
      background:rgba(0,0,0,.18);
    }

    .center-layer{
      position:absolute;
      inset:0;
      z-index:18;
      pointer-events:none;
    }

    .card-wrap{
      position:absolute;
      width:var(--card-w);
      height:var(--card-h);
      transform-style:preserve-3d;
      perspective:1200px;
      pointer-events:auto;
      opacity:1;
    }

    .card-face{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border-radius:24px;
      backface-visibility:hidden;
      overflow:hidden;
      border:2px solid rgba(255,255,255,.72);
      box-shadow:var(--shadow);
      opacity:1;
      visibility:visible;
    }

    .card-back{
      transform:rotateY(0deg);
      background:
        linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.05)),
        linear-gradient(145deg, #ff78b0, #8967ff, #48ccb0, #ffbd48);
    }

    .card-back::before{
      content:"";
      position:absolute;
      inset:14px;
      border-radius:18px;
      border:2px dashed rgba(255,255,255,.20);
    }

    .card-back::after{
      content:"♡ ✦ ♡";
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      color:rgba(255,255,255,.92);
      font-size:32px;
      font-weight:900;
      letter-spacing:8px;
      text-shadow:0 2px 8px rgba(0,0,0,.18);
    }

    .card-front{
      transform:rotateY(180deg);
      background:linear-gradient(180deg, rgba(255,255,255,1), rgba(249,244,255,1));
      color:var(--text);
    }

    .card-front::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 18% 15%, rgba(255,255,255,.9), transparent 16%),
        radial-gradient(circle at 78% 12%, rgba(255,255,255,.55), transparent 16%),
        radial-gradient(circle at 50% 120%, rgba(255,180,215,.22), transparent 40%);
      pointer-events:none;
    }

    .cat-normal .badge{ background:linear-gradient(135deg,#ff7cab,#ffa5c8); }
    .cat-advanced .badge{ background:linear-gradient(135deg,#7860ff,#ab98ff); }
    .cat-boss .badge{ background:linear-gradient(135deg,#e2324b,#ff7a59); }
    .cat-curse .badge{ background:linear-gradient(135deg,#2f9e84,#62d6b8); }
    .cat-fate .badge{ background:linear-gradient(135deg,#e8a21a,#ffd36b); }

    .reward{
      margin-top:12px;
      padding:10px 12px;
      border-radius:14px;
      font-size:18px;
      font-weight:900;
      text-align:center;
      letter-spacing:.5px;
      color:#5a3b00;
      background:linear-gradient(135deg,#fff3c9,#ffe08f);
      border:1px solid rgba(160,110,0,.18);
    }
    .reward.pumpkin{
      color:#6b2a00;
      background:linear-gradient(135deg,#ffe2c4,#ffb36b);
      border-color:rgba(170,80,0,.2);
    }
    .hand-card .reward{ font-size:11px; padding:5px 6px; margin-top:6px; border-radius:10px; }

    .deck-name{
      position:absolute;
      top:-46px;
      width:100%;
      text-align:center;
      font-size:20px;
      font-weight:900;
      letter-spacing:2px;
      color:#fff;
      text-shadow:0 4px 12px rgba(0,0,0,.4);
    }

    body.deck-trick .deck-back,
    body.deck-trick .card-back{
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04)),
        linear-gradient(145deg, #ff8a2b, #b0306e, #5b2a9e, #2b1d4f);
    }
    body.deck-house .deck-back,
    body.deck-house .card-back{
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04)),
        linear-gradient(145deg, #ff78b0, #8967ff, #48ccb0, #ffbd48);
    }

    .card-inner{
      position:absolute;
      inset:0;
      z-index:1;
    }

    .header{
      padding:16px 16px 8px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      color:#fff;
      font-size:12px;
      font-weight:900;
      border-radius:999px;
      box-shadow:0 6px 14px rgba(0,0,0,.12);
    }

    .icon{
      font-size:28px;
      filter:drop-shadow(0 4px 6px rgba(0,0,0,.08));
    }

    .content{
      padding:0 18px 18px;
      display:flex;
      flex-direction:column;
      height:calc(100% - 64px);
    }

    .title{
      font-size:30px;
      font-weight:900;
      line-height:1.2;
      margin:8px 0 12px;
      color:#33244e;
    }

    .desc{
      font-size:17px;
      line-height:1.7;
      color:#55476d;
      flex:1;
    }

    .effect{
      margin-top:14px;
      padding:12px 14px;
      border-radius:16px;
      font-size:14px;
      line-height:1.6;
      background:rgba(255,255,255,.82);
      border:1px solid rgba(120,80,160,.10);
      color:#554270;
      font-weight:700;
    }

    .stars{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
    }

    .stars span{
      position:absolute;
      animation:twinkle 2.8s ease-in-out infinite;
      opacity:.45;
    }

    @keyframes twinkle{
      0%,100%{ opacity:.2; transform:scale(.9); }
      50%{ opacity:.88; transform:scale(1.12); }
    }

    .flip-inner{
      position:relative;
      width:100%;
      height:100%;
      transform-style:preserve-3d;
      transition:transform .7s cubic-bezier(.2,.8,.2,1);
    }

    .flipped .flip-inner{
      transform:rotateY(180deg);
    }

    .hand-zone{
      position:absolute;
      left:50%;
      bottom:16px;
      transform:translateX(-50%);
      width:min(92vw,1400px);
      height:240px;
      z-index:12;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      pointer-events:none;
    }

    .hand-card{
      position:relative;
      width:var(--hand-w);
      height:var(--hand-h);
      margin-left:-30px;
      border-radius:20px;
      transform-origin:center bottom;
      pointer-events:auto;
      cursor:pointer;
      transition:transform .25s ease, box-shadow .25s ease, filter .25s ease;
    }

    .hand-card:first-child{ margin-left:0; }

    .hand-card:hover{
      transform:translateY(-18px) scale(1.08) !important;
      z-index:999 !important;
      box-shadow:0 22px 46px rgba(0,0,0,.35);
      filter:brightness(1.03);
    }

    .hand-card .title{ font-size:18px; margin:6px 0 8px; }
    .hand-card .desc{ font-size:11px; line-height:1.45; }
    .hand-card .effect{ font-size:10px; padding:8px 10px; margin-top:8px; }
    .hand-card .badge{ font-size:10px; padding:5px 8px; }
    .hand-card .icon{ font-size:22px; }
    .hand-card .header{ padding:12px 12px 4px; }
    .hand-card .content{ padding:0 12px 12px; height:calc(100% - 50px); }

    .multi-burst-card{
      width:240px;
      height:348px;
      left:50%;
      top:50%;
      opacity:0;
      transform:translate(-50%,-50%) scale(.18) rotate(0deg);
    }

    .multi-burst-card.fly{
      animation:burstToCenter .65s cubic-bezier(.2,.8,.2,1) forwards;
    }

    @keyframes burstToCenter{
      0%{
        right:110px;
        left:auto;
        top:50%;
        transform:translateY(-50%) scale(.18) rotate(-18deg);
        opacity:0;
      }
      20%{ opacity:1; }
      100%{
        left:50%;
        top:50%;
        transform:translate(-50%,-50%) scale(1) rotate(var(--rot));
        opacity:1;
      }
    }

    .multi-burst-card.to-hand{
      animation:burstToHand .58s cubic-bezier(.22,.8,.22,1) forwards;
    }

    @keyframes burstToHand{
      0%{
        left:50%;
        top:50%;
        transform:translate(-50%,-50%) scale(1) rotate(var(--rot));
        opacity:1;
      }
      100%{
        left:50%;
        top:83%;
        transform:translate(-50%,-50%) scale(.58) rotate(0deg);
        opacity:0;
      }
    }

    .active-card{
      position:absolute;
      left:50%;
      top:79%;
      width:var(--preview-w);
      height:var(--preview-h);
      transform:translate(-50%,-50%) scale(.68) rotate(0deg);
      z-index:25;
      pointer-events:auto;
      cursor:pointer;
      opacity:1;
    }

    .active-card.launch{
      animation:useCardQuick 0.78s cubic-bezier(.22,.8,.2,1) forwards;
    }

    @keyframes useCardQuick{
      0%{
        left:50%;
        top:79%;
        transform:translate(-50%,-50%) scale(.68) rotate(0deg);
        opacity:1;
      }
      40%{
        left:50%;
        top:46%;
        transform:translate(-50%,-50%) scale(1.02) rotate(420deg);
      }
      75%{
        left:50%;
        top:50%;
        transform:translate(-50%,-50%) scale(1.08) rotate(700deg);
      }
      100%{
        left:50%;
        top:50%;
        transform:translate(-50%,-50%) scale(1.04) rotate(720deg);
        opacity:1;
      }
    }

    .active-card.displaying{
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) scale(1.04) rotate(720deg);
      opacity:1;
      box-shadow:
        0 0 18px rgba(255,255,255,.55),
        0 0 34px rgba(255,216,120,.22),
        0 20px 52px rgba(0,0,0,.34);
    }

    .active-card.fade-out{
      animation:vanishCenter .42s ease forwards;
    }

    @keyframes vanishCenter{
      0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.04) rotate(720deg);
      }
      100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.18) rotate(760deg);
      }
    }

    .star-burst{
      position:absolute;
      left:50%;
      top:50%;
      width:16px;
      height:16px;
      pointer-events:none;
      z-index:70;
    }

    .star-burst span{
      position:absolute;
      left:0;
      top:0;
      font-size:18px;
      color:#fff3a6;
      text-shadow:
        0 0 8px rgba(255,240,160,.9),
        0 0 18px rgba(255,220,120,.65);
      opacity:0;
      animation:starBurstAnim .55s ease-out forwards;
    }

    @keyframes starBurstAnim{
      0%{ opacity:0; transform:translate(0,0) scale(.2) rotate(0deg); }
      18%{ opacity:1; transform:translate(0,0) scale(1) rotate(30deg); }
      100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(.45) rotate(120deg); }
    }

    .trail-spark{
      position:absolute;
      width:12px;
      height:12px;
      border-radius:50%;
      pointer-events:none;
      z-index:68;
      background: radial-gradient(circle, #fff, #ffe08f 55%, transparent 72%);
      animation: trailSparkAnim .55s ease-out forwards;
    }

    @keyframes trailSparkAnim{
      0%{ opacity:1; transform:translate(0,0) scale(1); }
      100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(.25); }
    }

    .toast{
      position:absolute;
      left:50%;
      top:124px;
      transform:translateX(-50%);
      z-index:50;
      color:#fff;
      background:rgba(16,16,22,.78);
      border:1px solid rgba(255,255,255,.15);
      backdrop-filter:blur(10px);
      border-radius:999px;
      padding:10px 16px;
      font-size:13px;
      font-weight:800;
      box-shadow:0 10px 24px rgba(0,0,0,.26);
      opacity:0;
      pointer-events:none;
    }

    .toast.show{
      animation:toastInOut 2.2s ease forwards;
    }

    @keyframes toastInOut{
      0%{ opacity:0; transform:translateX(-50%) translateY(-6px); }
      12%,78%{ opacity:1; transform:translateX(-50%) translateY(0); }
      100%{ opacity:0; transform:translateX(-50%) translateY(-6px); }
    }


    .score-panel{
      position:absolute;
      left:24px;
      top:18px;
      z-index:40;
      width:255px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 14px;
      border-radius:20px;
      background:var(--panel-bg);
      border:1px solid var(--panel-line);
      backdrop-filter:blur(12px);
      box-shadow:0 12px 28px rgba(0,0,0,.24);
    }
    .score-icon{ font-size:40px; line-height:1; filter:drop-shadow(0 4px 8px rgba(0,0,0,.3)); }
    .score-main{ flex:1; min-width:0; }
    .score-label{ font-size:13px; font-weight:900; opacity:.85; letter-spacing:1px; }
    .score-value{
      font-size:42px; font-weight:900; line-height:1.05;
      color:#ffe08f; text-shadow:0 0 14px rgba(255,210,110,.45);
      display:inline-block;
    }
    body.deck-house .score-value{ color:#ffb36b; text-shadow:0 0 14px rgba(255,150,60,.5); }
    .score-value.pop{ animation:scorePop .45s ease; }
    .score-value.drop{ animation:scoreDrop .45s ease; }
    @keyframes scorePop{ 0%{transform:scale(1)} 40%{transform:scale(1.35)} 100%{transform:scale(1)} }
    @keyframes scoreDrop{ 0%{transform:translateY(0)} 30%{transform:translateY(5px); opacity:.6} 100%{transform:translateY(0); opacity:1} }
    .score-btns{ display:grid; grid-template-columns:repeat(2, 34px); gap:6px; }
    .score-btn{
      appearance:none; border:1px solid var(--btn-line); cursor:pointer;
      width:34px; height:28px; border-radius:10px;
      color:#fff; font-weight:900; font-size:13px;
      background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.08));
    }
    .score-btn:hover{ filter:brightness(1.2); }
    .score-btn.reset{ grid-column:span 2; width:auto; font-size:11px; opacity:.75; }
    .score-btn.reset.armed{ background:#c23a4e; opacity:1; }
    body.obs-mode .score-btns{ opacity:.0; transition:opacity .2s; }
    body.obs-mode .score-panel:hover .score-btns{ opacity:1; }
    .left-panel{ top:150px !important; }

    @media (max-width: 1280px){
      :root{
        --preview-w: 290px;
        --preview-h: 420px;
        --hand-w: 138px;
        --hand-h: 200px;
      }
      .left-panel{ width:220px; }
      .deck-zone{ right:40px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
    <div class="orb d"></div>

    <div class="topbar">
      <button class="btn" id="switchDeckBtn">切換牌庫</button>
      <button class="btn" id="clearHandBtn">清空手牌</button>
      <button class="btn" id="resetAllBtn">重置牌庫</button>
    </div>

    <div class="score-panel" id="scorePanel">
      <div class="score-icon" id="scoreIcon">🎃</div>
      <div class="score-main">
        <div class="score-label" id="scoreLabel">我的南瓜燈</div>
        <div class="score-value" id="scoreValue">0</div>
      </div>
      <div class="score-btns">
        <button class="score-btn" data-delta="1">+1</button>
        <button class="score-btn" data-delta="-1">−1</button>
        <button class="score-btn" data-delta="2">+2</button>
        <button class="score-btn" data-delta="3">+3</button>
        <button class="score-btn reset" id="scoreResetBtn">歸零</button>
      </div>
    </div>

    <div class="left-panel">
      <div class="glass-panel">
        <div class="panel-title">牌庫剩餘數量</div>
        <div class="count-list" id="countList"></div>
      </div>
      <div class="glass-panel">
        <div class="panel-title">抽卡歷史</div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>

    <div class="deck-zone" id="deckZone">
      <div class="deck-stack">
        <div class="deck-name" id="deckName"></div>
        <div class="deck-back deck-l1"></div>
        <div class="deck-back deck-l2"></div>
        <div class="deck-back deck-main">DRAW<br>5</div>
        <div class="deck-label">點擊牌庫一次抽五張</div>
      </div>

      <div class="deck-preview" id="deckPreview">
        <div class="flip-inner flipped">
          <div class="card-face card-back"></div>
          <div class="card-face card-front">
            <div class="card-inner">
              <div class="header">
                <span class="badge">牌庫預覽</span>
                <span class="icon">✨</span>
              </div>
              <div class="content">
                <div class="title" id="previewTitle">一次抽五張</div>
                <div class="desc">
                  點擊右側牌庫，一次抽出五張卡加入手牌。<br><br>
                  對方喊 1–5 號後，點那張手牌飛到中央；再點一次中央卡片即可消失。
                </div>
                <div class="effect" id="previewEffect"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="focus-dim" id="focusDim"></div>
    <div class="center-layer" id="centerLayer"></div>
    <div class="hand-zone" id="handZone"></div>
    <div class="toast" id="toast"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    if(params.get("mode") === "obs") document.body.classList.add("obs-mode");

    // 屋主卡：屋主抽、搗蛋鬼執行，獎勵是「糖果」給搗蛋鬼
    // 搗蛋卡：搗蛋鬼抽、屋主執行，獎勵是「南瓜燈」給屋主
    // reward 為數字代表 +N；為字串代表特殊效果
    const DECKS = {
      house: {
        name: "屋主卡",
        unit: "糖果",
        unitIcon: "🍬",
        rewardClass: "",
        hint: "屋主抽卡、搗蛋鬼盲選並執行，搗蛋鬼拿糖果。",
        cards: [
          { title:"中二病發作", desc:"用最中二的語氣自我介紹 30 秒。", icon:"🦇", category:"小任務", type:"normal", reward:1 },
          { title:"新聞快報", desc:"用主播口吻播報「本台收到糖果」的重大消息。", icon:"📰", category:"小任務", type:"normal", reward:1 },
          { title:"反派稱讚", desc:"用大魔王語氣稱讚屋主三次。", icon:"😈", category:"小任務", type:"normal", reward:1 },
          { title:"語速挑戰", desc:"用播音員語速唸三次「不給糖就搗蛋」。", icon:"⚡", category:"小任務", type:"normal", reward:1 },
          { title:"冷笑話時間", desc:"講一個冷笑話，屋主要用最認真的語氣回應。", icon:"🧊", category:"小任務", type:"normal", reward:1 },
          { title:"南瓜叫賣", desc:"用夜市叫賣語氣賣南瓜 20 秒。", icon:"🎃", category:"小任務", type:"normal", reward:1 },
          { title:"三十秒辯論", desc:"替荒謬主題辯護 30 秒，例如「南瓜是最強的水果」。", icon:"🗯️", category:"大任務", type:"advanced", reward:2 },
          { title:"奇怪商品代言", desc:"替屋主的糖果屋代言 30 秒，不能說「好吃、可愛、漂亮」。", icon:"📣", category:"大任務", type:"advanced", reward:2 },
          { title:"假裝得獎", desc:"發表「年度最會討糖獎」30 秒得獎感言。", icon:"🏆", category:"大任務", type:"advanced", reward:2 },
          { title:"殭屍語言", desc:"用殭屍語氣跟屋主聊 1 分鐘。", icon:"🧟", category:"大任務", type:"advanced", reward:2 },
          { title:"即興廣播劇", desc:"屋主給三個詞，編一個 1 分鐘萬聖節故事。", icon:"📻", category:"大任務", type:"advanced", reward:2 },
          { title:"怪物聲帶圖鑑", desc:"屋主出題（例如「吸血鬼打噴嚏」），模仿三種怪物聲音。", icon:"👹", category:"大任務", type:"advanced", reward:2 },
          { title:"禁止說「糖」字", desc:"屋主陪聊 1 分鐘設陷阱，說出「糖」就失敗。", icon:"🚫", category:"魔王卡", type:"boss", reward:3, note:"失敗 0 顆；可放棄改拿 1 顆" },
          { title:"不准笑", desc:"屋主有 30 秒逗你笑，笑了就失敗。", icon:"😐", category:"魔王卡", type:"boss", reward:3, note:"失敗 0 顆；可放棄改拿 1 顆" },
          { title:"糖果談判專家", desc:"用三句話說服屋主，屋主不點頭就失敗。", icon:"🍭", category:"魔王卡", type:"boss", reward:3, note:"失敗 0 顆；可放棄改拿 1 顆" },
          { title:"桀桀桀詛咒", desc:"下一站每句話結尾都要加「桀桀桀」。", icon:"👻", category:"詛咒卡", type:"curse", reward:1 },
          { title:"羞恥稱號", desc:"屋主幫你取一個稱號，下一站自我介紹必須用它。", icon:"🏷️", category:"詛咒卡", type:"curse", reward:1 },
          { title:"唱歌敲門", desc:"下一站的開門口號要用唱的。", icon:"🎤", category:"詛咒卡", type:"curse", reward:1 },
          { title:"糖果雨", desc:"不用做任務，直接拿三顆！", icon:"🌧️", category:"命運卡", type:"fate", reward:3 },
          { title:"空籃子", desc:"沒有任務也沒有糖……屋主要安慰你 30 秒。", icon:"🧺", category:"命運卡", type:"fate", reward:1, note:"安慰獎" }
        ]
      },
      trick: {
        name: "搗蛋卡",
        unit: "南瓜燈",
        unitIcon: "🎃",
        rewardClass: "pumpkin",
        hint: "搗蛋鬼抽卡、屋主盲選並執行，屋主拿南瓜燈。",
        cards: [
          { title:"門鈴惡作劇", desc:"接下來 1 分鐘，屋主每次開口前要先學門鈴「叮咚」。", icon:"🔔", category:"小搗蛋", type:"normal", reward:1 },
          { title:"浮誇房仲", desc:"用最浮誇的房仲語氣推銷自己的糖果屋 30 秒。", icon:"🏠", category:"小搗蛋", type:"normal", reward:1 },
          { title:"一句話鬼故事", desc:"屋主用一句話講鬼故事，搗蛋鬼要裝作被嚇到。", icon:"🕯️", category:"小搗蛋", type:"normal", reward:1 },
          { title:"配音大師", desc:"用三種聲線說「歡迎光臨糖果屋」。", icon:"🎭", category:"小搗蛋", type:"normal", reward:1 },
          { title:"客訴專線", desc:"搗蛋鬼當奇怪客人客訴，屋主用客服語氣處理 30 秒。", icon:"🎧", category:"小搗蛋", type:"normal", reward:1 },
          { title:"唱歌迎賓", desc:"用自由曲調唱一句「不給糖就搗蛋」。", icon:"🎶", category:"小搗蛋", type:"normal", reward:1 },
          { title:"互相宣傳", desc:"幫搗蛋鬼的台打 30 秒廣告。", icon:"📢", category:"大搗蛋", type:"advanced", reward:2 },
          { title:"真心話問答", desc:"回答搗蛋鬼一個問題（安全範圍內）。", icon:"💬", category:"大搗蛋", type:"advanced", reward:2 },
          { title:"口頭禪感染", desc:"模仿搗蛋鬼的口頭禪三次。", icon:"🗣️", category:"大搗蛋", type:"advanced", reward:2 },
          { title:"禁止正常說話", desc:"接下來三句話都要用唱的或朗誦的。", icon:"🎼", category:"大搗蛋", type:"advanced", reward:2 },
          { title:"拍賣官", desc:"用拍賣官語氣，把一顆糖果「拍賣」給搗蛋鬼 30 秒。", icon:"🔨", category:"大搗蛋", type:"advanced", reward:2 },
          { title:"鬼屋導覽", desc:"即興導覽「鬼屋版」的自己的糖果屋 1 分鐘。", icon:"🏚️", category:"大搗蛋", type:"advanced", reward:2 },
          { title:"不准笑", desc:"搗蛋鬼有 30 秒逗屋主笑，笑了就失敗。", icon:"😐", category:"魔王卡", type:"boss", reward:3, note:"失敗 0 盞；可放棄改拿 1 盞" },
          { title:"禁止說「不」", desc:"搗蛋鬼連問 30 秒，屋主說出「不」就失敗。", icon:"🙅", category:"魔王卡", type:"boss", reward:3, note:"失敗 0 盞；可放棄改拿 1 盞" },
          { title:"屋主求饒", desc:"用三句話說服搗蛋鬼「不要搗蛋」，搗蛋鬼不點頭就失敗。", icon:"🙏", category:"魔王卡", type:"boss", reward:3, note:"失敗 0 盞；可放棄改拿 1 盞" },
          { title:"糖果屋改名", desc:"搗蛋鬼替糖果屋取新名字，下一位客人來時要用新名字介紹。", icon:"🪧", category:"陷阱卡", type:"curse", reward:1 },
          { title:"殭屍屋主", desc:"下一位客人來時，要用殭屍語氣迎接。", icon:"🧟", category:"陷阱卡", type:"curse", reward:1 },
          { title:"搗蛋鬼簽名", desc:"下一位客人來時，先說「XX 來搗蛋過了」並幫他宣傳一句。", icon:"✍️", category:"陷阱卡", type:"curse", reward:1 },
          { title:"南瓜燈被吹熄", desc:"不用做任務，但搗蛋鬼吹熄你 1 盞南瓜燈！", icon:"💨", category:"命運卡", type:"fate", reward:"屋主 −1 盞，搗蛋鬼 +1 顆糖果" },
          { title:"良心發現", desc:"搗蛋鬼良心發現，不用做任務！", icon:"😇", category:"命運卡", type:"fate", reward:3 }
        ]
      }
    };

    let currentDeckKey = params.get("deck") === "trick" ? "trick" : "house";
    function currentDeck(){ return DECKS[currentDeckKey]; }

    function rewardText(card){
      const d = currentDeck();
      if(typeof card.reward === "number") return `${d.unitIcon} +${card.reward} ${d.unit}`;
      return card.reward;
    }

    function applyDeckTheme(){
      const d = currentDeck();
      document.body.classList.remove("deck-house","deck-trick");
      document.body.classList.add("deck-" + currentDeckKey);
      document.getElementById("deckName").textContent = d.name;
      document.getElementById("previewTitle").textContent = d.name;
      document.getElementById("previewEffect").textContent = d.hint;
      document.title = `萬聖節任務抽卡｜${d.name}`;
    }

    const centerLayer = document.getElementById("centerLayer");
    const handZone = document.getElementById("handZone");
    const countList = document.getElementById("countList");
    const historyList = document.getElementById("historyList");
    const toast = document.getElementById("toast");
    const focusDim = document.getElementById("focusDim");
    const deckZone = document.getElementById("deckZone");

    let deck = [];
    let handCards = [];
    let drawBusy = false;
    let activeCardEl = null;
    let history = [];

    function shuffle(arr){
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.remove("show");
      void toast.offsetWidth;
      toast.classList.add("show");
    }

    function renderCounts(){
      const order = [];
      currentDeck().cards.forEach(c=>{ if(!order.includes(c.category)) order.push(c.category); });
      countList.innerHTML = order.map(cat=>{
        const n = deck.filter(c=>c.category===cat).length;
        return `<div class="count-row"><span>${cat}</span><span>${n}</span></div>`;
      }).join("");
    }

    function renderHistory(){
      historyList.innerHTML = "";
      if(history.length === 0){
        historyList.innerHTML = `<div class="history-item">尚未抽卡</div>`;
        return;
      }
      history.slice().reverse().forEach(item=>{
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `<b>${item.category}</b><br>${item.title}`;
        historyList.appendChild(div);
      });
    }

    function getCategoryClass(card){
      return "cat-" + card.type;
    }

    function makeStars(){
      const wrap = document.createElement("div");
      wrap.className = "stars";
      const chars = ["✦","✧","★","♡"];
      for(let i=0;i<8;i++){
        const s = document.createElement("span");
        s.textContent = chars[Math.floor(Math.random()*chars.length)];
        s.style.left = Math.random()*100 + "%";
        s.style.top = Math.random()*100 + "%";
        s.style.fontSize = (11 + Math.random()*7) + "px";
        s.style.animationDelay = (Math.random()*2.4) + "s";
        wrap.appendChild(s);
      }
      return wrap;
    }

    function createCardWrap(card, isHand=false, customClass=""){
  const wrap = document.createElement("div");
  wrap.className = `${isHand ? "hand-card" : "card-wrap"} ${getCategoryClass(card)} ${customClass}`.trim();

  wrap.innerHTML = `
    <div class="flip-inner">
      <div class="card-face card-back"></div>
      <div class="card-face card-front">
        <div class="card-inner">
          <div class="header">
            <span class="badge">${card.category}</span>
            <span class="icon">${card.icon}</span>
          </div>
          <div class="content">
            <div class="title">${card.title}</div>
            <div class="desc">${card.desc}</div>
            <div class="reward ${currentDeck().rewardClass}">${rewardText(card)}</div>
            ${card.note ? `<div class="effect">${card.note}</div>` : ""}
          </div>
        </div>
      </div>
    </div>
  `;
  wrap.querySelector(".card-front").appendChild(makeStars());

  if(isHand) wrap.classList.add("flipped");
  return wrap;
}

    function starBurst(target, count=14){
      const rect = target.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for(let i=0;i<count;i++){
        const wrap = document.createElement("div");
        wrap.className = "star-burst";
        wrap.style.left = centerX + "px";
        wrap.style.top = centerY + "px";

        const star = document.createElement("span");
        star.textContent = Math.random() > 0.5 ? "✦" : "★";
        star.style.setProperty("--dx", `${(Math.random()-0.5)*170}px`);
        star.style.setProperty("--dy", `${(Math.random()-0.5)*140}px`);
        star.style.animationDelay = `${Math.random()*80}ms`;

        wrap.appendChild(star);
        document.body.appendChild(wrap);
        setTimeout(()=>wrap.remove(), 700);
      }
    }

    function renderHand(){
      handZone.innerHTML = "";
      const total = handCards.length;

      handCards.forEach((card, index)=>{
        const el = createCardWrap(card, true);
        const spread = total > 1 ? (index - (total - 1) / 2) : 0;
        const rotate = spread * 6;
        const lift = Math.abs(spread) * 4;
        el.style.transform = `translateY(${lift}px) rotate(${rotate}deg)`;
        el.style.zIndex = 100 + index;
        el.addEventListener("click", ()=>useHandCard(index));
        handZone.appendChild(el);
      });
    }

    async function drawFiveCards(){
      if(drawBusy || activeCardEl) return;
      if(deck.length === 0){
        showToast("牌庫已空，請重置牌庫");
        return;
      }

      drawBusy = true;
      focusDim.classList.add("show");

      const drawCount = Math.min(5, deck.length);
      const drawn = [];

      for(let i=0;i<drawCount;i++){
        const card = deck.pop();
        drawn.push(card);
        history.push({ category: card.category, title: card.title });
      }

      renderCounts();
      renderHistory();

      const els = [];
      const rotations = [-18,-9,0,9,18];

      drawn.forEach((card, i)=>{
        const el = createCardWrap(card, false, "multi-burst-card");
        el.style.setProperty("--rot", rotations[i] + "deg");
        centerLayer.appendChild(el);
        els.push(el);
      });

      await new Promise(r=>requestAnimationFrame(r));
      els.forEach(el=>el.classList.add("fly"));

      setTimeout(()=>{
        els.forEach(el=>el.classList.add("flipped"));
      }, 520);

      setTimeout(()=>{
        requestAnimationFrame(()=>{
          els.forEach(el=>el.classList.add("to-hand"));
        });
      }, 1200);

      setTimeout(()=>{
        els.forEach(el=>{
          if(el.parentNode) el.remove();
        });
        handCards.push(...drawn);
        renderHand();
        focusDim.classList.remove("show");
        drawBusy = false;
      }, 1800);
    }

    function useHandCard(index){
      if(drawBusy || activeCardEl || handCards.length === 0) return;

      const card = handCards[index];
      handCards.splice(index, 1);
      renderHand();

      drawBusy = true;
      focusDim.classList.add("show");

      const active = createCardWrap(card, false, "active-card");
      active.classList.add("flipped");
      centerLayer.appendChild(active);
      activeCardEl = active;

      requestAnimationFrame(()=>{
        active.classList.add("launch");
      });

      setTimeout(()=>{
        starBurst(active, 16);
      }, 420);

      setTimeout(()=>{
        active.classList.remove("launch");
        active.classList.add("displaying");
        drawBusy = false;
      }, 780);

      const closeActive = () => {
        if(active.dataset.closing === "1") return;
        active.dataset.closing = "1";
        active.classList.add("fade-out");

        setTimeout(()=>{
          if(active.parentNode) active.remove();
          if(activeCardEl === active) activeCardEl = null;
          drawBusy = false;
          focusDim.classList.remove("show");
        }, 420);
      };

      active.addEventListener("click", ()=>{
        if(!active.classList.contains("displaying")) return;
        closeActive();
      });
    }

    function clearHand(){
      if(drawBusy || activeCardEl) return;
      handCards = [];
      renderHand();
      showToast("已清空手牌");
    }

    function initAll(){
      deck = shuffle([...currentDeck().cards]);
      handCards = [];
      history = [];
      drawBusy = false;
      activeCardEl = null;
      centerLayer.innerHTML = "";
      renderHand();
      renderCounts();
      renderHistory();
      focusDim.classList.remove("show");
      showToast("已重置牌庫");
    }

    deckZone.addEventListener("click", ()=>{
      drawFiveCards();
    });

    document.getElementById("clearHandBtn").addEventListener("click", clearHand);
    document.getElementById("resetAllBtn").addEventListener("click", initAll);

    function switchDeck(){
      if(drawBusy || activeCardEl) return;
      currentDeckKey = currentDeckKey === "house" ? "trick" : "house";
      const url = new URL(location.href);
      url.searchParams.set("deck", currentDeckKey);
      window.history.replaceState(null, "", url);
      applyDeckTheme();
      initAll();
      refreshScoreForDeck();
      showToast(`已切換為${currentDeck().name}`);
    }
    document.getElementById("switchDeckBtn").addEventListener("click", switchDeck);


    // ===== 計分：屋主頁（屋主卡）記南瓜燈；搗蛋鬼頁（搗蛋卡）記糖果 =====
    const SCORE_INFO = {
      house: { key:"halloween-score-pumpkin", icon:"🎃", label:"我的南瓜燈" },
      trick: { key:"halloween-score-candy",  icon:"🍬", label:"我的糖果" }
    };
    const scoreValueEl = document.getElementById("scoreValue");
    function loadScore(){
      try{ return parseInt(localStorage.getItem(SCORE_INFO[currentDeckKey].key) || "0", 10) || 0; }
      catch(e){ return scoreMem[currentDeckKey] || 0; }
    }
    const scoreMem = { house:0, trick:0 };
    let score = 0;
    function saveScore(){
      scoreMem[currentDeckKey] = score;
      try{ localStorage.setItem(SCORE_INFO[currentDeckKey].key, String(score)); }catch(e){}
    }
    function renderScore(anim){
      const info = SCORE_INFO[currentDeckKey];
      document.getElementById("scoreIcon").textContent = info.icon;
      document.getElementById("scoreLabel").textContent = info.label;
      scoreValueEl.textContent = score;
      if(anim){
        scoreValueEl.classList.remove("pop","drop");
        void scoreValueEl.offsetWidth;
        scoreValueEl.classList.add(anim);
      }
    }
    function changeScore(delta){
      score = Math.max(0, score + delta);
      saveScore();
      renderScore(delta > 0 ? "pop" : "drop");
      if(delta > 0) starBurst(scoreValueEl, 8);
    }
    function refreshScoreForDeck(){
      score = loadScore();
      renderScore();
    }
    document.querySelectorAll(".score-btn[data-delta]").forEach(btn=>{
      btn.addEventListener("click", ()=>changeScore(parseInt(btn.dataset.delta,10)));
    });
    const resetBtn = document.getElementById("scoreResetBtn");
    let resetTimer = null;
    resetBtn.addEventListener("click", ()=>{
      // 點兩下才歸零，避免誤觸
      if(resetBtn.classList.contains("armed")){
        clearTimeout(resetTimer);
        resetBtn.classList.remove("armed");
        resetBtn.textContent = "歸零";
        score = 0; saveScore(); renderScore("drop");
        showToast("分數已歸零");
      }else{
        resetBtn.classList.add("armed");
        resetBtn.textContent = "再點一次歸零";
        resetTimer = setTimeout(()=>{ resetBtn.classList.remove("armed"); resetBtn.textContent = "歸零"; }, 2500);
      }
    });

    document.addEventListener("keydown", (e)=>{
      if(["=","+","ArrowUp"].includes(e.key)){ e.preventDefault(); changeScore(1); return; }
      if(["-","_","ArrowDown"].includes(e.key)){ e.preventDefault(); changeScore(-1); return; }
      const key = e.key.toLowerCase();
      if(key === " "){
        e.preventDefault();
        if(!drawBusy && !activeCardEl) drawFiveCards();
      }
      if(key === "c" && !drawBusy && !activeCardEl) clearHand();
      if(key === "r") initAll();
    });

    applyDeckTheme();
    initAll();
    refreshScoreForDeck();
  </script>
</body>
</html>
